<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for dark mode -->
    <linearGradient id="darkModeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A78BFA;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hanzo "H" logo for dark mode - uses gradient -->
  <g fill="url(#darkModeGradient)">
    <!-- Left vertical bar -->
    <rect x="25" y="20" width="12" height="80" rx="2" />
    
    <!-- Right vertical bar -->
    <rect x="83" y="20" width="12" height="80" rx="2" />
    
    <!-- Horizontal connector -->
    <rect x="25" y="54" width="70" height="12" rx="2" />
    
    <!-- AI indicator dot -->
    <circle cx="60" cy="30" r="6" opacity="0.9" />
  </g>
</svg>