<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Hanzo "H" logo that uses currentColor for theme adaptation -->
  <g fill="currentColor">
    <!-- Left vertical bar -->
    <rect x="25" y="20" width="12" height="80" rx="2" />
    
    <!-- Right vertical bar -->
    <rect x="83" y="20" width="12" height="80" rx="2" />
    
    <!-- Horizontal connector -->
    <rect x="25" y="54" width="70" height="12" rx="2" />
    
    <!-- AI indicator dot with gradient accent -->
    <defs>
      <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
        <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
      </linearGradient>
    </defs>
    <circle cx="60" cy="30" r="6" fill="url(#aiGradient)" />
  </g>
</svg>