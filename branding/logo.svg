<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient that adapts to theme -->
    <linearGradient id="hanzoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Style that responds to prefers-color-scheme -->
    <style>
      .logo-fill {
        fill: url(#hanzoGradient);
      }
      
      /* Dark mode support */
      @media (prefers-color-scheme: dark) {
        .logo-fill {
          fill: url(#hanzoGradient);
        }
      }
      
      /* Light mode - use currentColor for better contrast */
      @media (prefers-color-scheme: light) {
        .logo-fill {
          fill: #1F2937;
        }
      }
      
      /* CSS class override support */
      .dark .logo-fill {
        fill: url(#hanzoGradient);
      }
      
      .light .logo-fill {
        fill: #1F2937;
      }
    </style>
  </defs>
  
  <!-- Hanzo "H" logo design -->
  <g class="logo-fill">
    <!-- Left vertical bar -->
    <rect x="25" y="20" width="12" height="80" rx="2" />
    
    <!-- Right vertical bar -->
    <rect x="83" y="20" width="12" height="80" rx="2" />
    
    <!-- Horizontal connector -->
    <rect x="25" y="54" width="70" height="12" rx="2" />
    
    <!-- AI indicator dot -->
    <circle cx="60" cy="30" r="6" opacity="0.8" />
  </g>
</svg>